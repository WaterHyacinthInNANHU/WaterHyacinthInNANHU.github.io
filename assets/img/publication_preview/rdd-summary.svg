<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img" aria-labelledby="title desc">
  <title id="title">RDD: from a long demonstration to skill-aligned training segments</title>
  <desc id="desc">Retrieve similar examples from the robot's skill-training data to choose boundaries in a long demonstration.</desc>
  <rect width="360" height="270" rx="8" fill="#f4f7fa"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#29485f">
    <text x="180" y="39" font-size="21">Long demonstration</text>
    <rect x="26" y="54" width="308" height="30" rx="5" fill="#a8b8c6"/>
    <path d="M180 94v18m-5-5 5 5 5-5" stroke="#7891a5" stroke-width="2" fill="none"/>
    <text x="180" y="143" font-size="20" font-weight="600">Retrieve matching skills</text>
    <path d="M180 155v18m-5-5 5 5 5-5" stroke="#7891a5" stroke-width="2" fill="none"/>
    <rect x="26" y="186" width="85" height="32" rx="4" fill="#608ca6"/>
    <rect x="117" y="186" width="121" height="32" rx="4" fill="#82a999"/>
    <rect x="244" y="186" width="90" height="32" rx="4" fill="#c3a572"/>
    <text x="180" y="249" font-size="20">Planner training segments</text>
  </g>
</svg>
